name: WikiBulz CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wikibulz-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  SITE_URL: https://wikibulz.com
  SITE_NAME: WikiBulz

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: SEO validation
        run: npm run validate:seo
      - name: Production build
        run: npm run build
      - name: Package release
        run: |
          tar -czf /tmp/wikibulz-release.tgz \
            --exclude=.git --exclude=node_modules --exclude=.env --exclude='.env.*' \
            --exclude=admin-reset.env --exclude='*-deploy.tar' --exclude='*.tgz' \
            --exclude='.next/cache' --exclude='*.log' .
          mv /tmp/wikibulz-release.tgz wikibulz-release.tgz
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikibulz-release
          path: wikibulz-release.tgz
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: wikibulz-release
          path: release
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      - name: Add VPS host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy with rollback protection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -f release/wikibulz-release.tgz
          scp -P "$DEPLOY_PORT" -o BatchMode=yes release/wikibulz-release.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/wikibulz-$RELEASE_ID.tgz"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$RELEASE_ID' '/tmp/wikibulz-$RELEASE_ID.tgz'" < deploy/remote-deploy.sh
      - name: Provision admin account
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          set -eu
          email_b64="$(printf %s "$ADMIN_EMAIL" | base64 -w0)"
          password_b64="$(printf %s "$ADMIN_PASSWORD" | base64 -w0)"
          node_script='const mongoose=require("mongoose"),bcrypt=require("bcryptjs");(async()=>{const email=Buffer.from(process.env.ADMIN_EMAIL_B64,"base64").toString();const password=Buffer.from(process.env.ADMIN_PASSWORD_B64,"base64").toString();await mongoose.connect("mongodb://mongodb:27017/wikibulz");const passwordHash=await bcrypt.hash(password,12);await mongoose.connection.collection("users").updateOne({email},{$set:{email,name:"WikiBulz Admin",role:"admin",active:true,passwordHash},$setOnInsert:{createdAt:new Date()}},{upsert:true});await mongoose.disconnect();console.log("admin-account-provisioned")})().catch(error=>{console.error(error.message);process.exit(1)})'
          script_b64="$(printf %s "$node_script" | base64 -w0)"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "docker exec -e ADMIN_EMAIL_B64=$email_b64 -e ADMIN_PASSWORD_B64=$password_b64 wikibulz-nextjs-1 node -e 'eval(Buffer.from(\"$script_b64\",\"base64\").toString())'"
