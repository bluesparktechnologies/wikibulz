name: WikiBulz CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: dite-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  SITE_URL: https://wikibulz.com
  SITE_NAME: WikiBulz
  ADMIN_PATH_SECRET: ${{ secrets.ADMIN_PATH_SECRET || 'control-room-7f4c9a2e' }}

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: SEO validation
        run: npm run validate:seo

      - name: Production build
        run: npm run build

      - name: Package release
        run: |
          tar -czf /tmp/wikibulz-release.tgz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude='.env.*' \
            --exclude=admin-reset.env \
            --exclude='*-deploy.tar' \
            --exclude='.next/cache' \
            --exclude='*.log' \
            .
          mv /tmp/wikibulz-release.tgz wikibulz-release.tgz

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikibulz-release
          path: wikibulz-release.tgz
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: wikibulz-release
          path: release

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Deploy with rollback protection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -f release/wikibulz-release.tgz
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' '${{ secrets.DEPLOY_KNOWN_HOSTS }}' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          scp -P "$DEPLOY_PORT" -o BatchMode=yes \
            release/wikibulz-release.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/wikibulz-$RELEASE_ID.tgz"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$RELEASE_ID' '/tmp/wikibulz-$RELEASE_ID.tgz'" \
            < deploy/remote-deploy.sh
